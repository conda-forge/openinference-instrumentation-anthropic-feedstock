schema_version: 1

context:
  name: openinference-instrumentation-anthropic
  version: "3.3.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/openinference_instrumentation_anthropic-${{ version }}.tar.gz
  sha256: e8c70376d281563e372925e7928c03c4f71e085f6469828a0fad00ce11442a17

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api
    - opentelemetry-instrumentation >=0.1.82
    - opentelemetry-semantic-conventions >=0.1.46
    - openinference-instrumentation >=0.1.15
    - openinference-semantic-conventions
    - typing-extensions

tests:
  - python:
      imports:
        - openinference.instrumentation.anthropic
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: OpenInference Anthropic Instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/Arize-ai/openinference

extra:
  recipe-maintainers:
    - michaelschiff
    - mikeldking
    - RogerHYang
    - axiomofjoy
    - anticorrelator
    - jsmolic
